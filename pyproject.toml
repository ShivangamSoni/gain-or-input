[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inputaudit"
version = "0.1.0"
description = "An input-availability audit for multimodal classifiers: twelve checks in two tiers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
torch = ["torch>=2.0"]

[project.scripts]
inputaudit = "inputaudit.__main__:main"

[tool.setuptools]
packages = ["inputaudit"]
